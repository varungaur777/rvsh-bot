# Runs the bot on GitHub Actions — for TESTING (spec §1.1, docs/SETUP.md "GitHub Actions").
#
# GitHub's terms allow Actions only for the repository's own build / test / deploy work, not as a 24/7 host:
# use this to try the bot or a change, keep production on a server (Docker / systemd).
#
# How it keeps going: one job runs the bot for up to ~5 h 40 min (GitHub ends a job at 6 h). At ~5 h 30 min the job
# starts the next run of this workflow; the new bot asks the old one to hand over (MongoDB instance lease) and the
# old one stops gracefully. The bot also stops by itself after 340 min (profile github_actions). A schedule every
# 6 h starts a run only when none is running (a missed hand-over).
#
# Needs (Settings → Secrets and variables → Actions → Secrets): BOT_TOKEN, API_ID, API_HASH, OWNER_ID,
# DUMP_CHANNEL_ID, IMAGE_DUMP_CHANNEL_ID, BRANDING, IMAGE_BOT_TOKENS, MONGO_URL (required here: the runner's disk is
# wiped after every job). Optional: QUIZ_DUMP_CHANNEL_ID, FORCE_SUB_CHANNELS, HTTP_PROXY, CLOUDFLARED_TOKEN,
# WEBAPP_BASE_URL. Start: Actions → "bot" → Run workflow. Stop: cancel the run (and disable the workflow).

name: bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write   # start the next run
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Skip when a run is already going (schedule only)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow bot.yml --status in_progress --json databaseId --jq 'length')
            if [ "$n" -gt 1 ]; then echo "another run is going - nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != '1'
        with:
          python-version: "3.13"
          cache: pip

      - name: System packages (Tesseract Hindi + English, Pango, cloudflared)
        if: steps.gate.outputs.skip != '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core wget
          sudo curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Python packages
        if: steps.gate.outputs.skip != '1'
        run: python -m pip install -q -r requirements.txt

      - name: Run the bot
        if: steps.gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_PROFILE: github_actions
          RVSH_SUPERVISED: "1"
          PYTHONUNBUFFERED: "1"
          DOWNLOAD_ROOT: ${{ runner.temp }}/rvsh
          ENV_FILE: ${{ runner.temp }}/rvsh.env
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DUMP_CHANNEL_ID: ${{ secrets.DUMP_CHANNEL_ID }}
          IMAGE_DUMP_CHANNEL_ID: ${{ secrets.IMAGE_DUMP_CHANNEL_ID }}
          QUIZ_DUMP_CHANNEL_ID: ${{ secrets.QUIZ_DUMP_CHANNEL_ID }}
          BRANDING: ${{ secrets.BRANDING }}
          IMAGE_BOT_TOKENS: ${{ secrets.IMAGE_BOT_TOKENS }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          FORCE_SUB_CHANNELS: ${{ secrets.FORCE_SUB_CHANNELS }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          WEBAPP_BASE_URL: ${{ secrets.WEBAPP_BASE_URL }}
        run: |
          mkdir -p "$DOWNLOAD_ROOT" && touch "$ENV_FILE"
          # the next run, ~10 min before this one stops (the new bot takes over through the lease)
          ( sleep $((330 * 60)) && gh workflow run bot.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" ) &
          crashes=0
          while true; do
            code=0; python -m bot || code=$?
            echo "bot exited with $code"
            if [ "$code" = 3 ]; then continue; fi            # /update: start the new code
            if [ "$code" = 1 ] && [ "$crashes" -lt 3 ]; then crashes=$((crashes + 1)); sleep 20; continue; fi
            break                                            # 0 = stopped / handed over, 2 = bad settings
          done
          exit $([ "$code" = 2 ] && echo 1 || echo 0)

      - name: Log file
        if: always() && steps.gate.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: ${{ runner.temp }}/rvsh/logs/
          retention-days: 7
          if-no-files-found: ignore
